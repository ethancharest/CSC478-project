# Builds the frontend and backend images and pushes them to GitHub Container Registry (GHCR).
#
# Runs when:
#   - something under app/ changes on main  -> tags :latest and :sha-<short commit>
#   - a version tag like v1.0.0 is pushed    -> also tags :1.0.0
#   - you click "Run workflow" on the Actions tab
#
# Images:
#   ghcr.io/<owner>/csc478-frontend
#   ghcr.io/<owner>/csc478-backend

name: Build and push images

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-images.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/csc478-${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
