{{- if not .Values.database.existingSecret }}
{{- $name := include "dashboard.dbSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
  annotations:
    # Keep the Secret on "helm uninstall" so a reinstall reuses the same
    # password that the existing database files on NFS were created with.
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ .Values.database.user | b64enc | quote }}
  {{- if $existing }}
  password: {{ index $existing.data "password" | quote }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
