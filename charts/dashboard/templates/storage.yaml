apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "dashboard.pvName" . }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.storage.capacity }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: {{ .Values.storage.reclaimPolicy }}
  storageClassName: ""
  mountOptions:
    {{- toYaml .Values.storage.mountOptions | nindent 4 }}
  nfs:
    server: {{ .Values.nfs.server | quote }}
    path: {{ .Values.nfs.path | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dashboard.fullname" . }}-pgdata
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  # Empty class + volumeName: bind to the static PV above, never a dynamic one.
  storageClassName: ""
  volumeName: {{ include "dashboard.pvName" . }}
  resources:
    requests:
      storage: {{ .Values.storage.claimSize }}
