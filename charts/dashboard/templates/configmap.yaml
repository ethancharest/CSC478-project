apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dashboard.fullname" . }}-config
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
data:
  ENV: {{ .Values.environment | quote }}
  DB_HOST: "db"
  DB_NAME: {{ .Values.database.name | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dashboard.fullname" . }}-db-init
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
data:
  init.sql: |
    {{- .Files.Get "files/init.sql" | nindent 4 }}
